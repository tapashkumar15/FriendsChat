<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
    background: #111827;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-container {
    background: #1f2937;
    width: 350px;
    padding: 20px;
    border-radius: 12px;
    color: white;
}

#chat-box {
    height: 300px;
    background: #374151;
    padding: 10px;
    overflow-y: auto;
    border-radius: 8px;
    margin-bottom: 15px;
}

.message-bar {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 5px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>My Chat</h2>

        <div id="chat-box"></div>

        <div class="message-bar">
            <input type="text" id="message"
            placeholder="Type your message...">

            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</body>
    <script src="script.js"></script>
</html>
